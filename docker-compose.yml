version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: infonure_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: infonure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: infonure_bot
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:postgresql://db:5432/infonure_db?currentSchema=tg_bot
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - BOT_NAME=${BOT_NAME}
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_ADMIN_IDS=${BOT_ADMIN_IDS}
      - LOG_FILE=logs/infonure
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data: